openapi: 3.0.1
info:
  title: Documento API
  description: "Rest API example: Documento API"
  version: 1.0.0-SNAPSHOT

servers:
  - url: http://localhost:8082
    description: Generated server url

tags:
  - name: Documento
    description: Rest API - Documento CRUD
  - name: Security
    description: Rest API - Security

security:
  - bearerAuth: [ ]

paths:
  /documento:
    get:
      tags:
        - Documento
      security: [ ]
      summary: Ritorna la lista di documenti
      operationId: findDocumento
      parameters:
        - $ref: '#/components/parameters/SortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: descrizione
          in: query
          required: false
          schema:
            type: string
        - name: data-da
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
        - name: data-a
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
      responses:
        "200":
          $ref: '#/components/responses/DocumentoListResponse'

    post:
      tags:
        - Documento
      summary: Aggiunge un documento
      operationId: createDocumento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Documento'
        required: true
      responses:
        "200":
          $ref: '#/components/responses/DocumentoResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

  /documento/{id}:
    get:
      tags:
        - Documento
      security: [ ]
      summary: Ritorna un documento
      operationId: getDocumento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: '#/components/responses/DocumentoResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

    put:
      tags:
        - Documento
      summary: Aggiorna un documento
      operationId: updateDocumento
      parameters:
        - in: path
          name: id
          schema:
            $ref: '#/components/schemas/Id'
          required: true
          description: id soggetto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Documento'
        required: true
      responses:
        "200":
          $ref: '#/components/responses/DocumentoResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

    delete:
      tags:
        - Documento
      summary: Elimina un documento
      operationId: deleteDocumento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: '#/components/responses/MessageResponse'
        "400":
          $ref: '#/components/responses/MessageResponse'

  /security/login:
    post:
      tags:
        - Security
      security: [ ]
      summary: Genera un JWT
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

components:

  parameters:
    PageNumber:
      name: page-number
      in: query
      description: Numero di pagina Zero-based  (0..N)
      required: true
      schema:
        type: integer
        minimum: 0

    PageSize:
      name: page-size
      in: query
      description: Dimensione della pagina
      required: true
      schema:
        type: integer
        minimum: 0

    SortField:
      name: sort-field
      in: query
      required: false
      schema:
        type: string

    SortOrder:
      name: sort-order
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SortOrder'

  responses:

    DocumentoListResponse:
      description: Lista di documenti
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentoPage'

    DocumentoResponse:
      description: Documento
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Documento'

    MessageResponse:
      description: Messaggio generico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:
    Autore:
      required:
        - nome
        - cognome
      type: object
      properties:
        nome:
          type: string
          description: Nome
        cognome:
          type: string
          description: Cognome

    Documento:
      required:
        - nome
        - descrizione
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
          description: Nome
          example: Titolo
        descrizione:
          type: string
          description: Descrizione
          example: Descrizione
        data:
          $ref: '#/components/schemas/Date'
        autori:
          type: array
          items:
            $ref: '#/components/schemas/Autore'

    DocumentoPage:
      allOf:
        - $ref: '#/components/schemas/Page'
      type: object
      required:
        - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Documento'

    Message:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          description: Codice risposta
          example: OK
        description:
          type: string
          description: Descrizione
          example: Operazione eseguita correttamente
        detail:
          type: string
          description: Descrizione dettagliata
          example: Operazione eseguita correttamente senza avvertimenti

    User:
      required:
        - userid
        - password
      type: object
      properties:
        userid:
          type: string
        password:
          type: string

    Token:
      type: object
      properties:
        jwtToken:
          type: string

    #############
    # TIPI BASE #
    #############

    SortOrder:
      type: string
      enum:
        - ASC
        - DESC

    Page:
      type: object
      required:
        - totalElements
        - totalPages
      properties:
        totalElements:
          type: integer
          minimum: 0
          format: int64
        totalPages:
          type: integer
          minimum: 0
          format: int64

    Date:
      type: string
      format: date
      example: '2022-04-22'

    DateTime:
      type: string
      format: date-time

    Id:
      type: integer
      format: int64

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT